name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run (macOS minutes are expensive).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs in parallel (the repo is public, so the extra machine is free): the app build plus
  # every package's tests, and the app build plus the XCUITests. UI tests run on pull requests
  # only: a push to main is a merged PR whose UI tests already passed.
  test:
    name: ${{ matrix.suite == 'ui' && 'UI tests' || 'Build and test' }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ github.event_name == 'pull_request' && fromJSON('["packages", "ui"]') || fromJSON('["packages"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('66Days.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Builds the app (warnings are errors) and runs, through the shared "66 Days" scheme, either
      # every package's tests (Core, Persistence, UI, AppShell) or the XCUITests (AppUITests).
      # -skipMacroValidation trusts SQLiteData's macros, which Xcode otherwise asks about
      # interactively. Package versions come only from the committed Package.resolved.
      - name: Build and test
        env:
          TESTS: ${{ matrix.suite == 'ui' && '-only-testing:AppUITests' || '-skip-testing:AppUITests' }}
        run: |
          xcodebuild test \
            -project 66Days.xcodeproj \
            -scheme "66 Days" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            "$TESTS" \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.suite }}
          path: build/TestResults.xcresult
