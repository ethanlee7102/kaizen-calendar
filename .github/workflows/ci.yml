name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run (macOS minutes are expensive).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('66Days.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Builds the app (warnings are errors) and runs every package's tests (Core, Persistence, UI)
      # through the shared "66 Days" scheme. -skipMacroValidation trusts SQLiteData's macros,
      # which Xcode otherwise asks about interactively. Package versions come only from the
      # committed Package.resolved.
      - name: Build and test
        run: |
          xcodebuild test \
            -project 66Days.xcodeproj \
            -scheme "66 Days" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
